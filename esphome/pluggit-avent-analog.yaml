# Pluggit Avent P / P300 / P450 — analoge 0–10-V-Steuerung über J8-7 / J8-8
#
# Handbuch (potentialfrei):
#   3 V → Stufe 1
#   6 V → Stufe 2
#   9 V → Stufe 3
#   0 V → Fernbedienung / Wochenprogramm behält die Kontrolle
#
# Hardware:
#   ESP32-DevKit
#   PWM-zu-0-10-V-Wandler (3,3-V-PWM-Eingang, 12-V-Versorgung)
#     Amazon: "PWM 0-10V DAC 3.3V" / Fafeicy 3,3V PWM zu 0-10V
#   12-V-Steckernetzteil für den Wandler
#
# Verdrahtung Wandler:
#   PWM DIN  ←  GPIO26 (LEDC)
#   PWM GND  ←  ESP32 GND
#   VCC      ←  12 V
#   AO       →  J8-7 blau (+)
#   AGND     →  J8-8 rot  (−)
#
# Die Analogeingänge der Avent P sind potentialfrei. AO/AGND dürfen
# nicht mit Schutzleiter oder 230-V-N verbunden werden.

substitutions:
  device_name: pluggit-avent-analog
  friendly_name: Pluggit Avent P Analog
  mqtt_prefix: pluggit_avent
  gpio_pwm: GPIO26
  pwm_frequency: "1000Hz"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Pluggit Avent P 0-10V an J8-7/J8-8
  project:
    name: pluggit.avent_p_analog
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline
  on_message:
    - topic: ${mqtt_prefix}/speed/set
      then:
        - lambda: |-
            int stage = atoi(x.c_str());
            float voltage = 0.0;
            if (stage == 1) voltage = 3.0;
            else if (stage == 2) voltage = 6.0;
            else if (stage == 3) voltage = 9.0;
            auto call = id(analog_voltage).make_call();
            call.set_value(voltage);
            call.perform();

# 12 V Speisung des Wandlers, 0–10 V Ausgang.
# 3 V = 30 %, 6 V = 60 %, 9 V = 90 % Tastverhältnis.
output:
  - platform: ledc
    pin: ${gpio_pwm}
    id: pwm_out
    frequency: ${pwm_frequency}

number:
  - platform: template
    id: analog_voltage
    name: "Steuerspannung"
    unit_of_measurement: "V"
    icon: mdi:sine-wave
    min_value: 0
    max_value: 10
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 0
    set_action:
      - output.set_level:
          id: pwm_out
          level: !lambda "return x / 10.0;"
      - mqtt.publish:
          topic: ${mqtt_prefix}/speed
          payload: !lambda |-
            if (x < 1.5) return "0";
            if (x < 4.5) return "1";
            if (x < 7.5) return "2";
            return "3";
          retain: true

fan:
  - platform: template
    id: kwl_fan
    name: "Lüftung"
    speed_count: 3
    on_speed_set:
      then:
        - number.set:
            id: analog_voltage
            value: !lambda |-
              if (x <= 1) return 3.0;
              if (x == 2) return 6.0;
              return 9.0;
    on_turn_off:
      then:
        - number.set:
            id: analog_voltage
            value: 0.0
    on_turn_on:
      then:
        - number.set:
            id: analog_voltage
            value: 6.0

button:
  - platform: template
    name: "Stufe 1"
    icon: mdi:fan-speed-1
    on_press:
      - number.set:
          id: analog_voltage
          value: 3.0
  - platform: template
    name: "Stufe 2"
    icon: mdi:fan-speed-2
    on_press:
      - number.set:
          id: analog_voltage
          value: 6.0
  - platform: template
    name: "Stufe 3"
    icon: mdi:fan-speed-3
    on_press:
      - number.set:
          id: analog_voltage
          value: 9.0
  - platform: template
    name: "Fernbedienung"
    icon: mdi:remote
    on_press:
      - number.set:
          id: analog_voltage
          value: 0.0

