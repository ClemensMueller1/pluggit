# Pluggit Avent P / P300 / P450 — UART-Weiche am Funkmodul
#
# Die Funk-Fernbedienung DTH-029255-04 spricht intern Modbus-RTU
# mit 4800 Baud über das nRF905-Funkmodul an die Hauptplatine.
# Diese Firmware hängt sich als 3,3-V-UART an dieselbe Schnittstelle
# (Projekt d00616/P300, KNX-User-Forum).
#
# NUR 3,3 V. 5-V-Arduino (Uno, Nano) zerstört die Hauptplatine.
# Strom der KWL vorher abschalten. Funkmodul-Stecker abziehen,
# ESP32 dazwischen oder parallel auf RX/TX/GND.
#
# Getestet mit Funkmodul-Software 03.08.01 (Aufkleber an der Antenne).
# Funktioniert NICHT mit Software 02.00.03.
#
# Pinbelegung ESP32 (anpassen):
#   GPIO17 TX  →  RX der Hauptplatine (über 1 kΩ Vorwiderstand)
#   GPIO16 RX  ←  TX der Hauptplatine
#   GND        ↔  GND der Hauptplatine
#   3V3        nicht von der KWL speisen — ESP32 hat eigenes USB-Netzteil
#
# Slave-Adresse 1, Holding Registers, Funktion 0x03 / 0x10.

substitutions:
  device_name: pluggit-avent-uart
  friendly_name: Pluggit Avent P UART
  mqtt_prefix: pluggit_avent
  uart_tx: GPIO17
  uart_rx: GPIO16
  modbus_address: "0x01"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Pluggit Avent P UART/Modbus 4800 8N1
  project:
    name: pluggit.avent_p_uart
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline
  on_message:
    - topic: ${mqtt_prefix}/speed/set
      then:
        - number.set:
            id: speed_set
            value: !lambda |-
              int stage = atoi(x.c_str());
              if (stage < 1) stage = 1;
              if (stage > 3) stage = 3;
              return stage;

uart:
  id: uart_p300
  tx_pin: ${uart_tx}
  rx_pin: ${uart_rx}
  baud_rate: 4800
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 256

modbus:
  id: modbus_hub
  uart_id: uart_p300
  send_wait_time: 200ms

modbus_controller:
  - id: p300
    address: ${modbus_address}
    modbus_id: modbus_hub
    setup_priority: -10
    update_interval: 10s
    command_throttle: 200ms

# Register-Zuordnung nach KNX-User-Forum / d00616/P300.
# Die P300-UART-Register sind NICHT identisch mit den späteren
# AP190/AP310-Modbus-TCP-Registern. Adressen bei Bedarf anpassen.
sensor:
  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Außenluft T1"
    id: t1
    register_type: holding
    address: 0x0001
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 1.0
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t1
            payload: !lambda "return esphome::to_string(x);"

  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Zuluft T2"
    id: t2
    register_type: holding
    address: 0x0002
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t2
            payload: !lambda "return esphome::to_string(x);"

  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Abluft T3"
    id: t3
    register_type: holding
    address: 0x0003
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t3
            payload: !lambda "return esphome::to_string(x);"

  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Fortluft T4"
    id: t4
    register_type: holding
    address: 0x0004
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t4
            payload: !lambda "return esphome::to_string(x);"

  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Lüfterstufe"
    id: speed_reg
    register_type: holding
    address: 0x000A
    value_type: U_WORD
    accuracy_decimals: 0
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/speed
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true

number:
  - platform: modbus_controller
    modbus_controller_id: p300
    name: "Soll-Stufe"
    id: speed_set
    register_type: holding
    address: 0x000A
    value_type: U_WORD
    min_value: 1
    max_value: 3
    step: 1
    mode: slider
