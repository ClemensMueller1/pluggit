# Pluggit Avent P — nRF905-Funksniffer / Fernbedienungs-Ersatz (868,4 MHz)
#
# Die Original-Fernbedienung DTH-029255-04 nutzt einen Nordic nRF905
# auf 868,4 MHz (KNX-User-Forum, Beitrag #218).
#
# Boot: Replay mit gespeicherter ShockBurst-Adresse (CRC-16). Das Log
# zeigt „NVM ShockBurst address: …“. Fan Aus/1/2/3 sendet die vier
# 32-Byte-Pakete aus der HA-MQTT-Config auf rf/tx.
# Sniff nur über den Button „RF Adresse neu lernen“. Pluggit-Adresse ist
# 00 00 xx xx. Nach dem Lock jede FB-Taste (Aus/1/2/3) drücken und das
# 32-Byte-Paket in HA Funkpaket 1–4 eintragen. Die Adresse erscheint in
# der HA-Config (ShockBurst-Adresse) und kann dort gesetzt werden;
# HA sendet sie auf rf/address/set, der ESP speichert sie im NVM.
#
# Hardware:
#   ESP32-DevKit (3,3 V)
#   nRF905-Modul 868 MHz (PTR8000+ / NF905SE, SMA-Antenne)
#   Billige 868-Module haben oft nur ~20 cm Reichweite — FB dicht halten.
#
# SPI-Verdrahtung ESP32 → nRF905:
#   3V3  → VCC     (niemals 5 V)
#   GND  → GND
#   GPIO23 MOSI → MOSI / SI
#   GPIO19 MISO → MISO / SO
#   GPIO18 SCK  → SCK
#   GPIO5  CS   → CSN   (Strapping-Pin, idle HIGH — passt zu CSN)
#   GPIO4  → CE
#   GPIO16 → TXE
#   GPIO17 → PWR
#   GPIO22 → DR (Data Ready, nicht GPIO15: Strapping-Pin)
#   optional CD / AM des Moduls an freie GPIOs (Diagnose)
#
# ESPHome 2026.3+: custom_component ist entfernt. Die Komponente liegt
# als External Component in ./components/nrf905_pluggit/.
# Den Ordner components/ mit ins ESPHome-Config-Verzeichnis kopieren
# (neben diese YAML), oder die GitHub-Quelle unten verwenden.
#
# Adresse lernen: Button „RF Adresse neu lernen“, FB ~20 cm am Modul,
# eine Taste drücken. Sensor "Funkadresse" zeigt 00 00 xx xx (wird im
# Flash gespeichert). Danach Aus/1/2/3 an der FB drücken und die Pakete
# in HA eintragen. Optional fest:
#   rx_address: [0x00, 0x00, 0x0A, 0x7A]

substitutions:
  device_name: pluggit-avent-rf
  friendly_name: Pluggit Avent P RF
  mqtt_prefix: pluggit_avent

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: nRF905 868.4 MHz Sniffer für Pluggit DTH-029255-04
  project:
    name: pluggit.avent_p_rf
    version: "1.4.1"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Lokal (YAML und components/ im selben Ordner) oder vom GitHub-Repo.
external_components:
  - source:
      type: local
      path: components
    components: [nrf905_pluggit]
  # Alternative, wenn nur die YAML in HA liegt:
  # - source: github://ClemensMueller1/pluggit@main
  #   components: [nrf905_pluggit]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline
  on_connect:
    - mqtt.publish:
        topic: ${mqtt_prefix}/rf/address
        payload: !lambda "return id(nrf_address).state;"
        retain: true
  on_message:
    - topic: ${mqtt_prefix}/rf/tx
      then:
        - nrf905_pluggit.transmit:
            id: nrf
            data: !lambda "return x;"
    - topic: ${mqtt_prefix}/rf/address/set
      then:
        - nrf905_pluggit.set_address:
            id: nrf
            data: !lambda "return x;"
        - mqtt.publish:
            topic: ${mqtt_prefix}/rf/address
            payload: !lambda "return id(nrf_address).state;"
            retain: true

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

nrf905_pluggit:
  id: nrf
  cs_pin:
    number: GPIO5
    ignore_strapping_warning: true
  ce_pin: GPIO4
  txe_pin: GPIO16
  pwr_pin: GPIO17
  dr_pin:
    number: GPIO22
    mode:
      input: true
      pulldown: true
  last_packet:
    id: nrf_last_packet
    name: "Letztes Funkpaket"
  listen_address:
    id: nrf_address
    name: "Funkadresse"
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/rf/address
            payload: !lambda "return x;"
            retain: true
  rf_rx:
    name: "Funkempfang"
  radio_ok:
    name: "nRF905 SPI"
  on_packet:
    - mqtt.publish:
        topic: ${mqtt_prefix}/rf/rx
        payload: !lambda "return x;"

button:
  - platform: template
    name: "RF Replay (letztes Paket)"
    icon: mdi:remote
    on_press:
      - nrf905_pluggit.transmit:
          id: nrf
          data: !lambda "return id(nrf_last_packet).state;"
  - platform: template
    name: "RF Adresse neu lernen"
    icon: mdi:radar
    on_press:
      - nrf905_pluggit.start_sniff:
          id: nrf
