# Pluggit Avent P — nRF905-Funksniffer / Fernbedienungs-Ersatz (868,4 MHz)
#
# Die Original-Fernbedienung DTH-029255-04 nutzt einen Nordic nRF905
# auf 868,4 MHz (KNX-User-Forum, Beitrag #218).
#
# Boot: Sniff-Modus (1-Byte-Adresse 0x00, CRC aus). Pluggit nutzt die
# ShockBurst-Adresse 00 00 xx xx — nicht das Nordic-Default E7 E7 E7 E7.
# Nach dem ersten gültigen Tastendruck sperrt die Firmware die gelernte
# Adresse und schaltet auf CRC-16. Danach Taste erneut drücken für ein
# vollständiges 32-Byte-Paket.
#
# Hardware:
#   ESP32-DevKit (3,3 V)
#   nRF905-Modul 868 MHz (PTR8000+ / NF905SE, SMA-Antenne)
#   Billige 868-Module haben oft nur ~20 cm Reichweite — FB dicht halten.
#
# SPI-Verdrahtung ESP32 → nRF905:
#   3V3  → VCC     (niemals 5 V)
#   GND  → GND
#   GPIO23 MOSI → MOSI / SI
#   GPIO19 MISO → MISO / SO
#   GPIO18 SCK  → SCK
#   GPIO21 CS   → CSN   (nicht GPIO5: Strapping-Pin)
#   GPIO4  → CE
#   GPIO16 → TXE
#   GPIO17 → PWR
#   GPIO22 → DR (Data Ready, nicht GPIO15: Strapping-Pin)
#   optional CD / AM des Moduls an freie GPIOs (Diagnose)
#
# ESPHome 2026.3+: custom_component ist entfernt. Die Komponente liegt
# als External Component in ./components/nrf905_pluggit/.
# Den Ordner components/ mit ins ESPHome-Config-Verzeichnis kopieren
# (neben diese YAML), oder die GitHub-Quelle unten verwenden.
#
# Nach dem Flashen: Log öffnen, Taste an der Original-FB drücken
# (Modul ~20 cm von der FB). Sensor "Funkadresse" zeigt 00 00 xx xx.
# Bekannte Adresse fest eintragen:
#   rx_address: [0x00, 0x00, 0x0A, 0x7A]

substitutions:
  device_name: pluggit-avent-rf
  friendly_name: Pluggit Avent P RF
  mqtt_prefix: pluggit_avent

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: nRF905 868.4 MHz Sniffer für Pluggit DTH-029255-04
  project:
    name: pluggit.avent_p_rf
    version: "1.2.0"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Lokal (YAML und components/ im selben Ordner) oder vom GitHub-Repo.
external_components:
  - source:
      type: local
      path: components
    components: [nrf905_pluggit]
  # Alternative, wenn nur die YAML in HA liegt:
  # - source: github://ClemensMueller1/pluggit@main
  #   components: [nrf905_pluggit]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

nrf905_pluggit:
  id: nrf
  cs_pin: GPIO21
  ce_pin: GPIO4
  txe_pin: GPIO16
  pwr_pin: GPIO17
  dr_pin:
    number: GPIO22
    mode:
      input: true
      pulldown: true
  last_packet:
    id: nrf_last_packet
    name: "Letztes Funkpaket"
  listen_address:
    name: "Funkadresse"
  rf_rx:
    name: "Funkempfang"
  radio_ok:
    name: "nRF905 SPI"
  on_packet:
    - mqtt.publish:
        topic: ${mqtt_prefix}/rf/rx
        payload: !lambda "return x;"

button:
  - platform: template
    name: "RF Replay (letztes Paket)"
    icon: mdi:remote
    on_press:
      - nrf905_pluggit.transmit:
          id: nrf
          data: !lambda "return id(nrf_last_packet).state;"
  - platform: template
    name: "RF Adresse neu lernen"
    icon: mdi:radar
    on_press:
      - nrf905_pluggit.start_sniff:
          id: nrf
