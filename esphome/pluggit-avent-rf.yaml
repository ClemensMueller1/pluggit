# Pluggit Avent P — nRF905 auf 868,4 MHz
#
# Sniff, Replay und der Link-Test (tx/test, rx/test) nutzen dieselbe
# Frequenz: HFREQ_PLL=1, CH_NO=118 / 0x76, Byte 1 = 0x0E.
#
# Boot: Replay mit gespeicherter ShockBurst-Adresse (CRC-16). Das Log
# zeigt „NVM ShockBurst address: …“. Fan Aus/1/2/3 sendet die vier
# 32-Byte-Pakete aus der HA-MQTT-Config auf rf/tx.
# Lüfterstufe und T1–T4 stehen in der Anlagen-Antwort 80 90 auf die
# Abfrage 90 80 03 04 00 (Register 0x0400). Der ESP sendet diese Abfrage
# 15 s nach dem Start und dann alle 10 min. MQTT: speed, t1, t2, t3, t4.
# Sniff nur über den Button „RF Adresse neu lernen“: CRC aus,
# TX-Adresslänge 4, RX-Adresslänge 0 (Config-Byte 2 = 0x40). Breite 0
# als TX-Länge sendet dieses Modul die TX-Adresse 16-mal (64 Byte) vor
# die Nutzdaten. Der Chip sendet die Adresse LSB zuerst, 11 22 33 44
# also als 44 33 22 11. Lehnt der Chip Byte 2 ungleich 0x40 ab, endet
# der Sniff sofort. Sonst geht einmal das Link-Test-Muster mit der
# schon gesetzten Adresse raus (eine Adresse, dann 32 Byte Text), danach
# jeder Empfang als SNIFF RX. Steht 80 90 03 18 im Puffer, loggt der ESP
# „SNIFF device address 00 00 xx xx“ (Address 05/06). Der Sniff endet
# erst, wenn die ShockBurst-Adresse in HA gesetzt wird; HA sendet sie
# auf rf/address/set, der ESP speichert sie im NVM. Danach Aus/1/2/3 an
# der FB drücken und die 32-Byte-Pakete in HA Funkpaket 1–4 eintragen.
#
# Link-Test zweier Module (NVM und gelernte Adresse werden nicht benutzt):
#   {prefix}/rx/test   Empfang (leer oder listen), off = Replay zurück
#   {prefix}/tx/test   Senden (Text oder Hex, leer = Testmuster)
# Beide Seiten programmieren dasselbe Registerbild:
#   76 0E 44 20 20 00 00 12 34 D8
#   868,4 MHz, Adresse 00 00 12 34, AFW 4/4, 32 Byte, CRC-16.
# Ein Rahmen ohne CRC-/Adressfehler steht im Log als "TEST RX CRC-16 OK".
# tx/test und rx/test sind während des Sniff gesperrt.
#
# Hardware:
#   ESP32-DevKit (3,3 V)
#   nRF905-Modul 868 MHz (PTR8000+ / NF905SE, Antenne für 868 MHz)
#
# SPI-Verdrahtung ESP32 → nRF905:
#   3V3  → VCC     (niemals 5 V)
#   GND  → GND
#   GPIO23 MOSI → MOSI / SI
#   GPIO19 MISO → MISO / SO
#   GPIO18 SCK  → SCK
#   GPIO5  CS   → CSN   (Strapping-Pin, idle HIGH — passt zu CSN)
#   GPIO21 → CE
#   GPIO16 → TXE
#   GPIO17 → PWR
#   GPIO22 → DR (Data Ready, nicht GPIO15: Strapping-Pin)
#   optional CD / AM des Moduls an freie GPIOs (Diagnose)
#
# ESPHome 2026.3+: custom_component ist entfernt. Die Komponente kommt
# von github://ClemensMueller1/pluggit@sensors (esphome/components/).
#
# Adresse lernen: Button „RF Adresse neu lernen“, FB ~20 cm am Modul,
# eine Taste drücken. Im Log „SNIFF device address 00 00 xx xx“ ablesen
# und in HA als ShockBurst-Adresse speichern. Das beendet den Sniff.
# Danach Aus/1/2/3 an der FB drücken und die Pakete in HA eintragen.
# Optional fest:
#   rx_address: [0x00, 0x00, 0x0A, 0x7A]

substitutions:
  device_name: pluggit-avent-rf
  friendly_name: Pluggit Avent P RF
  mqtt_prefix: pluggit_avent

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: nRF905 868.4 MHz sniff, replay and sensor poll
  project:
    name: pluggit.avent_p_rf
    version: "1.7.3-868"
  on_boot:
    - priority: -100
      then:
        - delay: 15s
        - nrf905_pluggit.request_sensors:
            id: nrf

esp32:
  board: esp32dev
  framework:
    type: arduino

# Dieser Branch. refresh 0s, damit 868,4 MHz nicht aus einem älteren Cache kommt.
external_components:
  - source: github://ClemensMueller1/pluggit@sensors
    refresh: 0s
    components: [nrf905_pluggit]
  # Lokal, wenn YAML und components/ im selben Ordner liegen:
  # - source:
  #     type: local
  #     path: components
  #   components: [nrf905_pluggit]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline
  on_connect:
    - mqtt.publish:
        topic: ${mqtt_prefix}/rf/address
        payload: !lambda "return id(nrf_address).state;"
        retain: true
  on_message:
    - topic: ${mqtt_prefix}/rf/tx
      then:
        - nrf905_pluggit.transmit:
            id: nrf
            data: !lambda "return x;"
    - topic: ${mqtt_prefix}/rf/address/set
      then:
        - nrf905_pluggit.set_address:
            id: nrf
            data: !lambda "return x;"
        - mqtt.publish:
            topic: ${mqtt_prefix}/rf/address
            payload: !lambda "return id(nrf_address).state;"
            retain: true
    - topic: ${mqtt_prefix}/rx/test
      then:
        - nrf905_pluggit.test_listen:
            id: nrf
            data: !lambda "return x;"
    - topic: ${mqtt_prefix}/tx/test
      then:
        - nrf905_pluggit.transmit_test:
            id: nrf
            data: !lambda "return x;"

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

nrf905_pluggit:
  id: nrf
  cs_pin:
    number: GPIO5
    ignore_strapping_warning: true
  ce_pin: GPIO21
  txe_pin: GPIO16
  pwr_pin: GPIO17
  dr_pin:
    number: GPIO22
    mode:
      input: true
      pulldown: true
  last_packet:
    id: nrf_last_packet
    name: "Letztes Funkpaket"
  listen_address:
    id: nrf_address
    name: "Funkadresse"
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/rf/address
            payload: !lambda "return x;"
            retain: true
  rf_rx:
    name: "Funkempfang"
  radio_ok:
    name: "nRF905 SPI"
  fan_stage:
    id: rf_fan_stage
    internal: true
    force_update: true
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/speed
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true
  t1:
    id: rf_t1
    internal: true
    force_update: true
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t1
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true
  t2:
    id: rf_t2
    internal: true
    force_update: true
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t2
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true
  t3:
    id: rf_t3
    internal: true
    force_update: true
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t3
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true
  t4:
    id: rf_t4
    internal: true
    force_update: true
    on_value:
      then:
        - mqtt.publish:
            topic: ${mqtt_prefix}/t4
            payload: !lambda "return esphome::to_string((int) x);"
            retain: true
  on_packet:
    - mqtt.publish:
        topic: ${mqtt_prefix}/rf/rx
        payload: !lambda "return x;"

button:
  - platform: template
    name: "RF Replay (letztes Paket)"
    icon: mdi:remote
    on_press:
      - nrf905_pluggit.transmit:
          id: nrf
          data: !lambda "return id(nrf_last_packet).state;"
  - platform: template
    name: "RF Adresse neu lernen"
    icon: mdi:radar
    on_press:
      - nrf905_pluggit.start_sniff:
          id: nrf

interval:
  - interval: 10min
    then:
      - nrf905_pluggit.request_sensors:
          id: nrf
