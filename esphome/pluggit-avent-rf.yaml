# Pluggit Avent P — nRF905-Funksniffer / Fernbedienungs-Ersatz (868,4 MHz)
#
# Die Original-Fernbedienung DTH-029255-04 nutzt einen Nordic nRF905
# auf 868,4 MHz (KNX-User-Forum, Beitrag #218).
#
# Diese Firmware ist der Einstieg: sie sniffed Pakete, damit die
# Geräteadresse der eigenen Fernbedienung ermittelt werden kann.
# Senden (Replay) erst nach erfolgreichem Sniff — sonst stört man
# die Pairing-Adresse nicht.
#
# Hardware:
#   ESP32-DevKit (3,3 V)
#   nRF905-Modul 868 MHz (PTR8000+ / NF905SE, SMA-Antenne)
#   Amazon: "Hailege NRF905 Wireless Transceiver Modul PTR8000+"
#   Botland: nRF905 433/868/915 MHz THT-Transceiver
#
# SPI-Verdrahtung ESP32 → nRF905:
#   3V3  → VCC     (niemals 5 V)
#   GND  → GND
#   GPIO23 MOSI → MOSI / SI
#   GPIO19 MISO → MISO / SO
#   GPIO18 SCK  → SCK
#   GPIO5  CS   → CSN
#   GPIO4  → CE
#   GPIO16 → TXE
#   GPIO17 → PWR
#   GPIO15 → DR (Data Ready)
#   GPIO2  → CD (Carrier Detect, optional)
#
# Nach dem Flashen: ESPHome-Log öffnen, Taste an der Original-
# Fernbedienung drücken, 32-Byte-Payload notieren. Die ersten
# Bytes sind die Geräteadresse.

substitutions:
  device_name: pluggit-avent-rf
  friendly_name: Pluggit Avent P RF
  mqtt_prefix: pluggit_avent
  nrf_cs: GPIO5
  nrf_ce: GPIO4
  nrf_txe: GPIO16
  nrf_pwr: GPIO17
  nrf_dr: GPIO15

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: nRF905 868.4 MHz Sniffer für Pluggit DTH-029255-04
  includes:
    - nrf905_pluggit.h
  libraries:
    - SPI

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  birth_message:
    topic: ${mqtt_prefix}/availability
    payload: online
  will_message:
    topic: ${mqtt_prefix}/availability
    payload: offline

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

custom_component:
  - lambda: |-
      auto nrf = new PluggitNrf905(
          ${nrf_cs}, ${nrf_ce}, ${nrf_txe}, ${nrf_pwr}, ${nrf_dr});
      App.register_component(nrf);
      return {nrf};

text_sensor:
  - platform: template
    name: "Letztes Funkpaket"
    id: last_packet
    icon: mdi:radio-tower

binary_sensor:
  - platform: template
    name: "Funkempfang"
    id: rf_rx
    device_class: connectivity
